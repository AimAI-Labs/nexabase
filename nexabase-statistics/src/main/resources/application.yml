server:
  port: 8005

spring:
  application:
    name: nexabase-statistics
  profiles:
    active: dev,local
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:nexabase-dev}
        group: DEFAULT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:nexabase-dev}
        file-extension: yml
        group: DEFAULT_GROUP
