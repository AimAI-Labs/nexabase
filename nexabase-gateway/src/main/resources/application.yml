server:
  port: 8000

spring:
  application:
    name: nexabase-gateway
  profiles:
    # dev：对应 Nacos 远程配置 dataId = nexabase-gateway-dev.yml
    # local：加载本地 application-local.yml，注入 Nacos 地址/账号等敏感信息
    active: dev,local
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:nexabase-dev}
        group: DEFAULT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:nexabase-dev}
        file-extension: yml
        group: DEFAULT_GROUP
    gateway:
      # Spring Cloud 2025.0+ 配置前缀变更：
      # spring.cloud.gateway.* → spring.cloud.gateway.server.webflux.*
      # （对应 spring-cloud-gateway-server-webflux 构件）
      # 参考：https://spring.io/blog/2025/05/29/spring-cloud-2025-0-0-is-abvailable#spring-cloud-gateway
      server:
        webflux:
          # 默认路由兜底配置：当 Nacos（nexabase-gateway-dev.yml）未下发路由时保证网关可用。
          # Nacos 配置优先级更高，可动态覆盖或新增路由。
          # 开启基于服务名的自动路由（lb://服务名），路由规则从 Nacos 拉取
          discovery:
            locator:
              # 开启后可通过 /服务名/接口路径 访问
              # 必须开启，否则 Knife4j 聚合的后端服务文档会报 404，导致文档请求异常
              enabled: true
  # spring.config.import 移至 application-local.yml
  # 确保在 server-addr/namespace 加载后再执行 Nacos 配置导入

# 网关 JWT 校验配置（secret 必须与 auth 服务一致，生产环境通过 Nacos 共享）
nexabase:
  jwt:
    secret: ${JWT_SECRET:change-me-in-production-at-least-32-chars}
    access-token-ttl: 30m
    refresh-token-ttl: 7d
    whitelist-paths:
      - /api/v1/auth/login
      - /api/v1/auth/refresh
      - /doc.html
      - /webjars/
      - /v3/api-docs
      - /swagger-ui
      - /swagger-resources
    # 开发测试 Token 配置（方便本地调试时直接使用固定 Bearer Token 访问接口）
    dev-token:
      enabled: ${DEV_TOKEN_ENABLED:true}
      token: ${DEV_TOKEN:dev-test-token}
      user-id: 1
      username: dev-admin