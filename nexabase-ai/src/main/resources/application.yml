server:
  port: 8006

spring:
  application:
    name: nexabase-ai
  profiles:
    active: dev,local
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:nexabase-dev}
        group: DEFAULT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:nexabase-dev}
        file-extension: yml
        group: DEFAULT_GROUP

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Flyway 数据库迁移
spring.flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true
