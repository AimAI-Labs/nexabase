server:
  port: 8008

spring:
  application:
    name: nexabase-graph
  profiles:
    # 同时激活 dev 和 local 两个 profile：
    # - dev：对应 Nacos 远程配置 dataId = nexabase-graph-dev.yml
    # - local：加载本地 application-local.yml，注入 Nacos / Neo4j 地址及账号等敏感信息
    #   （local 在 dev 之后激活，优先级更高，可覆盖远程配置）
    #   该文件已加入 .gitignore，不会提交到仓库；缺失时回退到下方占位符默认值，不阻断启动。
    active: dev,local
  cloud:
    nacos:
      # Nacos 服务器地址，可通过环境变量或 application-local.yml 覆盖
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      # 服务注册与发现配置
      discovery:
        namespace: ${NACOS_NAMESPACE:nexabase-dev}
        group: DEFAULT_GROUP
      # 配置中心配置
      config:
        namespace: ${NACOS_NAMESPACE:nexabase-dev}
        file-extension: yml
        group: DEFAULT_GROUP
  neo4j:
    # Neo4j 连接信息，可通过环境变量或 application-local.yml 覆盖
    uri: ${NEO4J_URI:neo4j://localhost:7687}
    authentication:
      username: ${NEO4J_USERNAME:neo4j}
      password: ${NEO4J_PASSWORD:password}
  # spring.config.import 已移至 application-local.yml。
  # 原因：application.yml 中的 import 会在 local profile 加载前执行，
  #   此时 server-addr 仍为默认的 127.0.0.1:8848，导致 "Server check fail" 错误。
  #   将 import 放入 application-local.yml 可确保在 server-addr / namespace
  #   等连接信息加载后再执行 Nacos 配置导入。
  # 非本地环境请通过环境变量 NACOS_SERVER_ADDR 等设置连接信息，
  # 并在对应 profile 文件中添加 spring.config.import。


logging:
  pattern:
    dateformat: "yyMMdd | HH:mm:ss.SSS"
  level:
    org.springframework.data.neo4j.cypher: DEBUG

# Knife4j API 文档
springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
knife4j:
  enable: true
  setting:
    language: zh_cn
