server:
  port: 8002

spring:
  application:
    name: nexabase-document
  profiles:
    active: dev
  cloud:
    nacos:
      server-addr: 127.0.0.1:8080
      username: nacos
      password: "密码自己设置" # 请替换为实际的Nacos密码
      discovery:
        namespace: nexabase-dev
        group: DEFAULT_GROUP
      config:
        namespace: nexabase-dev
        file-extension: yml
        group: DEFAULT_GROUP
  config:
    import:
      - optional:nacos:${spring.application.name}-${spring.profiles.active}.${spring.cloud.nacos.config.file-extension}
  datasource:
    url: jdbc:mysql://127.0.0.1:3306/nexabase_document?useUnicode=true&characterEncoding=utf-8&useSSL=false&serverTimezone=Asia/Shanghai
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    mongodb:
      uri: mongodb://admin:nexabase_mongo_pwd@127.0.0.1:27017/nexabase_document?authSource=admin
  rabbitmq:
    host: 127.0.0.1
    port: 5672
    username: admin
    password: nexabase_rmq_pwd
