server:
  port: 8001

spring:
  application:
    name: nexabase-auth
  profiles:
    # dev：对应 Nacos 远程配置 dataId = nexabase-auth-dev.yml
    # local：加载本地 application-local.yml，注入 Nacos 地址/账号等敏感信息
    active: dev,local
  cloud:
    nacos:
      server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
      username: ${NACOS_USERNAME:nacos}
      password: ${NACOS_PASSWORD:nacos}
      discovery:
        namespace: ${NACOS_NAMESPACE:nexabase-dev}
        group: DEFAULT_GROUP
      config:
        namespace: ${NACOS_NAMESPACE:nexabase-dev}
        file-extension: yml
        group: DEFAULT_GROUP
  # spring.config.import 移至 application-local.yml
  # 确保在 server-addr/namespace 加载后再执行 Nacos 配置导入

# MyBatis-Plus 配置
mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      logic-delete-field: is_deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

# Flyway 数据库迁移
spring.flyway:
  enabled: true
  locations: classpath:db/migration
  baseline-on-migrate: true
